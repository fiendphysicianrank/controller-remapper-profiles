[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "controller-remapper-profiles"
version = "0.6.3"
description = "Per-game controller remapping for Windows — device-agnostic input translation with profile hot-swap."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "controller-remapper-profiles maintainers" }]
keywords = ["controller", "remapper", "xinput", "hid", "profiles", "windows", "gaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1",
    "watchdog>=4.0.0",
    "psutil>=5.9.8",
    "pywin32>=306; sys_platform == 'win32'",
    "vgamepad>=0.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
crmp = "crmp.__main__:main"

[project.gui-scripts]
crmp-tray = "crmp.tray:run"

[tool.hatch.build.targets.wheel]
packages = ["src/crmp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true